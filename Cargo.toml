[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
rust-version = "1.90"

[workspace.dependencies]
rspigot-anvil = { path = "/opt/minecraft/dev/rspigot/crates/rspigot-anvil" }
rspigot-plugin = { path = "/opt/minecraft/dev/rspigot/crates/rspigot-plugin" }
rspigot-core = { path = "/opt/minecraft/dev/rspigot/crates/rspigot-core" }
rspigot-domain = { path = "/opt/minecraft/dev/rspigot/crates/rspigot-domain" }
rspigot-nbt = { path = "/opt/minecraft/dev/rspigot/crates/rspigot-nbt" }
rspigot-plugins = { path = "/opt/minecraft/dev/rspigot/crates/rspigot-plugins" }

axum = "0.8"
base64 = "0.22"
crossbeam-channel = "0.5"
dotenvy = "0.15"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["serde", "v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
