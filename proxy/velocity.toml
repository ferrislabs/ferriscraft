# Velocity 4.3.x — Proxy FerrisCraft (Minecraft 26.3 / protocole 777)
config-version = "2.9"

bind = "0.0.0.0:25565"
motd = "<gold><bold>FerrisCraft</bold></gold> <dark_gray>•</dark_gray> <light_purple>Mini-Jeux & SheepWars</light_purple>"
show-max-players = 100

online-mode = true
force-key-authentication = false
prevent-client-proxy-connections = false

# Forwarding moderne signé HMAC-SHA256 vers rspigot (spigot.yml -> settings.velocity)
player-info-forwarding-mode = "modern"
forwarding-secret-file = "forwarding.secret"

announce-forge = false
kick-existing-players = false
sample-players-in-ping = false
enable-player-address-logging = true

[ping-passthrough]
version = false
players = true
description = false
favicon = true
modinfo = false

[packet-limiter]
interval = 7
packets-per-second = -1
bytes-per-second = -1
decompressed-bytes-per-second = 5242880

[servers]
lobby = "127.0.0.1:25566"
sheepwars = "127.0.0.1:25567"
towerwars = "127.0.0.1:25568"

try = [
    "lobby"
]

[forced-hosts]
"lobby.localhost" = [
    "lobby"
]
"sheepwars.localhost" = [
    "sheepwars"
]
"towerwars.localhost" = [
    "towerwars"
]

[advanced]
compression-threshold = 256
compression-level = -1
login-ratelimit = 500
connection-timeout = 5000
read-timeout = 30000
haproxy-protocol = false
tcp-fast-open = false
bungee-plugin-message-channel = true
show-ping-requests = false
failover-on-unexpected-server-disconnect = true
announce-proxy-commands = true
log-command-executions = false
log-player-connections = true
accepts-transfers = true
enable-reuse-port = false
command-rate-limit = 50
forward-commands-if-rate-limited = true
kick-after-rate-limited-commands = 0
tab-complete-rate-limit = 10
kick-after-rate-limited-tab-completes = 0

[query]
enabled = false
port = 25565
map = "FerrisCraft"
show-plugins = false
