name: Build & Publish Images

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/images.yml
      - .dockerignore
      - Dockerfile
      - docker-bake.hcl
      - rspigot.ref
      - Cargo.toml
      - Cargo.lock
      - crates/**
      - proxy/**
      - deploy/docker/**
      - server/**
      - server-sheepwars/**
      - lobby.json
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  OWNER: ferrislabs

jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout ferriscraft
        uses: actions/checkout@v4
        with:
          path: ferriscraft

      - name: Read pinned rspigot commit
        id: rspigot
        run: echo "ref=$(tr -d '[:space:]' < ferriscraft/rspigot.ref)" >> "$GITHUB_OUTPUT"

      - name: Checkout rspigot
        uses: actions/checkout@v4
        with:
          repository: ferrislabs/rspigot
          ref: ${{ steps.rspigot.outputs.ref }}
          path: rspigot
          token: ${{ secrets.RSPIGOT_READ_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push PR Images (read-only cache)
        if: github.event_name == 'pull_request'
        uses: docker/bake-action@v6
        with:
          workdir: ferriscraft
          source: .
          files: docker-bake.hcl
          allow: |
            fs.read=${{ github.workspace }}/rspigot
          push: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          set: |
            *.cache-from=type=gha,scope=ferriscraft-${{ runner.arch }}
        env:
          IMAGE_REGISTRY: ${{ env.REGISTRY }}/${{ env.OWNER }}
          IMAGE_TAG: pr-${{ github.event.pull_request.number }}
          EXTRA_TAG: pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          RSPIGOT_DIR: ${{ github.workspace }}/rspigot
          RSPIGOT_REF: ${{ steps.rspigot.outputs.ref }}

      - name: Build & Push Images (BuildKit Bake)
        if: github.event_name != 'pull_request'
        uses: docker/bake-action@v6
        with:
          workdir: ferriscraft
          source: .
          files: docker-bake.hcl
          allow: |
            fs.read=${{ github.workspace }}/rspigot
          push: true
          set: |
            *.cache-from=type=gha,scope=ferriscraft-${{ runner.arch }}
            *.cache-to=type=gha,mode=max,scope=ferriscraft-${{ runner.arch }}
        env:
          IMAGE_REGISTRY: ${{ env.REGISTRY }}/${{ env.OWNER }}
          IMAGE_TAG: latest
          EXTRA_TAG: ${{ github.sha }}
          RSPIGOT_DIR: ${{ github.workspace }}/rspigot
          RSPIGOT_REF: ${{ steps.rspigot.outputs.ref }}

  # Deploys to prod: writes the new commit into infra, Argo CD does the rest.
  # The chart is read from this repository at that same commit, so both
  # infra files move together. Runs once every image is pushed, only for main.
  bump-infra:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: images
    runs-on: ubuntu-latest
    permissions: {}
    # Two merges close together must bump one after the other, never race.
    concurrency:
      group: bump-infra
      cancel-in-progress: false
    steps:
      - name: Checkout infra
        uses: actions/checkout@v4
        with:
          repository: ferrislabs/infra
          ref: main
          token: ${{ secrets.INFRA_BOT_TOKEN }}

      - name: Bump chart and image commit
        env:
          SHA: ${{ github.sha }}
        run: |
          yq -i '.global.imageTag = strenv(SHA)' apps/ferriscraft/images.yaml
          yq -i '(.spec.sources[] | select(.repoURL == "https://github.com/ferrislabs/ferriscraft") | .targetRevision) = strenv(SHA)' argocd/apps/ferriscraft.yaml
          grep -q "imageTag: ${SHA}" apps/ferriscraft/images.yaml
          grep -q "targetRevision: ${SHA}" argocd/apps/ferriscraft.yaml

      - name: Commit and push
        env:
          SHA: ${{ github.sha }}
        run: |
          if git diff --quiet; then
            echo "infra already at ${SHA::7}, nothing to do"
            exit 0
          fi
          git config user.name "ferriscraft-ci"
          git config user.email "ferriscraft-ci@users.noreply.github.com"
          git commit -am "chore(ferriscraft): deploy sha-${SHA::7}"
          for attempt in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          echo "could not push the bump after 3 attempts" >&2
          exit 1
