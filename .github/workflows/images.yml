name: Build & Publish Images

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/images.yml
      - .dockerignore
      - Dockerfile
      - docker-bake.hcl
      - Cargo.toml
      - Cargo.lock
      - crates/**
      - proxy/**
      - deploy/docker/**
      - server/**
      - server-sheepwars/**
      - lobby.json
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  OWNER: ferrislabs

jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout ferriscraft
        uses: actions/checkout@v4
        with:
          path: ferriscraft

      - name: Checkout rspigot
        uses: actions/checkout@v4
        with:
          repository: ferrislabs/rspigot
          path: rspigot
          token: ${{ secrets.RSPIGOT_READ_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Images (PR validation with read-only cache)
        if: github.event_name == 'pull_request'
        uses: docker/bake-action@v6
        with:
          workdir: ferriscraft
          source: .
          files: docker-bake.hcl
          allow: |
            fs.read=${{ github.workspace }}/rspigot
          push: false
          set: |
            *.cache-from=type=gha,scope=ferriscraft-${{ runner.arch }}
        env:
          IMAGE_REGISTRY: ${{ env.REGISTRY }}/${{ env.OWNER }}
          IMAGE_TAG: pr-${{ github.event.pull_request.number }}
          RSPIGOT_DIR: ${{ github.workspace }}/rspigot

      - name: Build & Push Images (BuildKit Bake)
        if: github.event_name != 'pull_request'
        uses: docker/bake-action@v6
        with:
          workdir: ferriscraft
          source: .
          files: docker-bake.hcl
          allow: |
            fs.read=${{ github.workspace }}/rspigot
          push: true
          set: |
            *.cache-from=type=gha,scope=ferriscraft-${{ runner.arch }}
            *.cache-to=type=gha,mode=max,scope=ferriscraft-${{ runner.arch }}
        env:
          IMAGE_REGISTRY: ${{ env.REGISTRY }}/${{ env.OWNER }}
          IMAGE_TAG: latest
          EXTRA_TAG: ${{ github.sha }}
          RSPIGOT_DIR: ${{ github.workspace }}/rspigot
