name: Build & Publish Images

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  OWNER: ferrislabs

jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout ferriscraft
        uses: actions/checkout@v4
        with:
          path: ferriscraft

      - name: Checkout rspigot
        uses: actions/checkout@v4
        with:
          repository: ferrislabs/rspigot
          path: rspigot
          token: ${{ secrets.RSPIGOT_READ_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push ferriscraft-orchestrator
        uses: docker/build-push-action@v6
        with:
          context: ferriscraft
          file: ferriscraft/deploy/docker/Dockerfile.orchestrator
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/ferriscraft-orchestrator:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/ferriscraft-orchestrator:${{ github.sha }}

      - name: Build & Push ferriscraft-velocity
        uses: docker/build-push-action@v6
        with:
          context: ferriscraft
          file: ferriscraft/deploy/docker/Dockerfile.velocity
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/ferriscraft-velocity:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/ferriscraft-velocity:${{ github.sha }}

      - name: Build & Push ferriscraft-rspigot
        uses: docker/build-push-action@v6
        with:
          context: ferriscraft
          file: ferriscraft/deploy/docker/Dockerfile.rspigot
          build-contexts: |
            rspigot=rspigot
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/ferriscraft-rspigot:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/ferriscraft-rspigot:${{ github.sha }}

      - name: Build & Push ferriscraft-lobby
        uses: docker/build-push-action@v6
        with:
          context: ferriscraft
          file: ferriscraft/deploy/docker/Dockerfile.lobby
          build-contexts: |
            rspigot=rspigot
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/ferriscraft-lobby:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/ferriscraft-lobby:${{ github.sha }}
