apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ferriscraft.fullname" . }}-orchestrator
  labels:
    {{- include "ferriscraft.labels" . | nindent 4 }}
    app.kubernetes.io/component: orchestrator
spec:
  replicas: {{ .Values.orchestrator.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "ferriscraft.labels" . | nindent 6 }}
      app.kubernetes.io/component: orchestrator
  template:
    metadata:
      annotations:
        checksum/sheepwars-template: {{ include (print $.Template.BasePath "/sheepwars-template-cm.yaml") . | sha256sum }}
      labels:
        {{- include "ferriscraft.labels" . | nindent 8 }}
        app.kubernetes.io/component: orchestrator
    spec:
      serviceAccountName: {{ include "ferriscraft.fullname" . }}-orchestrator
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: orchestrator
          image: {{ include "ferriscraft.image" (dict "global" .Values.global "repository" .Values.orchestrator.image.repository "tag" .Values.orchestrator.image.tag) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          env:
            - name: RUST_LOG
              value: {{ .Values.orchestrator.logLevel | quote }}
            - name: ORCHESTRATOR_BIND
              value: {{ printf "0.0.0.0:%d" (int .Values.orchestrator.port) | quote }}
            - name: ORCHESTRATOR_BACKEND
              value: "kubernetes"
            - name: K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: ORCHESTRATOR_PUBLIC_URL
              value: {{ printf "http://%s-orchestrator:%d" (include "ferriscraft.fullname" .) (int .Values.orchestrator.port) | quote }}
            - name: LOBBY_SERVER_NAME
              value: "lobby"
            - name: QUEUE_MIN_PLAYERS
              value: {{ .Values.orchestrator.queue.minPlayers | quote }}
            - name: SHEEPWARS_MAX_PLAYERS
              value: {{ .Values.orchestrator.sheepwars.maxPlayers | quote }}
            - name: SHEEPWARS_MIN_REPLICAS
              value: {{ .Values.orchestrator.sheepwars.minReplicas | quote }}
            - name: SHEEPWARS_MAX_REPLICAS
              value: {{ .Values.orchestrator.sheepwars.maxReplicas | quote }}
            - name: SHEEPWARS_STANDBY_SERVERS
              value: {{ .Values.orchestrator.sheepwars.standbyServers | quote }}
            - name: SHEEPWARS_IDLE_TTL_SECS
              value: {{ .Values.orchestrator.sheepwars.idleTtlSecs | quote }}
            - name: SHEEPWARS_STARTING_TIMEOUT_SECS
              value: {{ .Values.orchestrator.sheepwars.startingTimeoutSecs | quote }}
            - name: TRANSFER_TIMEOUT_SECS
              value: {{ .Values.orchestrator.sheepwars.transferTimeoutSecs | quote }}
            - name: SHEEPWARS_EMPTY_GRACE_SECS
              value: {{ .Values.orchestrator.sheepwars.emptyGraceSecs | quote }}
            - name: SHEEPWARS_ENDING_TIMEOUT_SECS
              value: {{ .Values.orchestrator.sheepwars.endingTimeoutSecs | quote }}
            - name: SHEEPWARS_HEARTBEAT_TIMEOUT_SECS
              value: {{ .Values.orchestrator.sheepwars.heartbeatTimeoutSecs | quote }}
            - name: SHEEPWARS_CRD_ENABLED
              value: {{ .Values.orchestrator.sheepwars.crd.enabled | quote }}
            - name: RECONCILE_INTERVAL_MS
              value: {{ .Values.orchestrator.sheepwars.reconcileIntervalMs | quote }}
            - name: SHEEPWARS_PORT
              value: {{ .Values.sheepwars.port | quote }}
            - name: SHEEPWARS_POD_TEMPLATE_PATH
              value: "/etc/ferriscraft/template/pod-template.yaml"
            {{- if (include "ferriscraft.orchestratorTokenSecretName" .) }}
            - name: ORCHESTRATOR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "ferriscraft.orchestratorTokenSecretName" . }}
                  key: token
            {{- end }}
            {{- if .Values.s3.enabled }}
            - name: S3_ENDPOINT
              value: {{ .Values.s3.endpoint | quote }}
            - name: S3_BUCKET
              value: {{ .Values.s3.bucket | quote }}
            - name: S3_PREFIX
              value: {{ .Values.s3.prefix | quote }}
            - name: S3_REGION
              value: {{ .Values.s3.region | quote }}
            - name: S3_PATH_STYLE
              value: {{ .Values.s3.pathStyle | quote }}
            - name: S3_CACHE_TTL_SECS
              value: {{ .Values.s3.cacheTtlSecs | quote }}
            {{- if .Values.s3.fixedMap }}
            - name: SHEEPWARS_MAP
              value: {{ .Values.s3.fixedMap | quote }}
            {{- end }}
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "ferriscraft.s3SecretName" . }}
                  key: accessKeyId
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "ferriscraft.s3SecretName" . }}
                  key: secretAccessKey
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.orchestrator.port }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- with .Values.orchestrator.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: pod-template
              mountPath: /etc/ferriscraft/template
              readOnly: true
      volumes:
        - name: pod-template
          configMap:
            name: {{ include "ferriscraft.fullname" . }}-sheepwars-template
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ferriscraft.fullname" . }}-orchestrator
  labels:
    {{- include "ferriscraft.labels" . | nindent 4 }}
    app.kubernetes.io/component: orchestrator
spec:
  selector:
    {{- include "ferriscraft.labels" . | nindent 4 }}
    app.kubernetes.io/component: orchestrator
  ports:
    - name: http
      port: {{ .Values.orchestrator.port }}
      targetPort: http
      protocol: TCP
