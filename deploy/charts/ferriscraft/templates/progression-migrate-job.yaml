{{- if .Values.progression.existingDatabaseSecret }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "ferriscraft.fullname" . }}-progression-migrate
  labels:
    {{- include "ferriscraft.labels" . | nindent 4 }}
    app.kubernetes.io/component: progression-migrate
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        {{- include "ferriscraft.labels" . | nindent 8 }}
        app.kubernetes.io/component: progression-migrate
    spec:
      restartPolicy: Never
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: {{ include "ferriscraft.image" (dict "global" .Values.global "repository" .Values.orchestrator.image.repository "tag" .Values.orchestrator.image.tag) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command: ["/usr/local/bin/ferriscraft-migrate"]
          env:
            - name: RUST_LOG
              value: info
            - name: PROGRESSION_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.progression.existingDatabaseSecret }}
                  key: {{ .Values.progression.databaseUriKey }}
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
{{- end }}
