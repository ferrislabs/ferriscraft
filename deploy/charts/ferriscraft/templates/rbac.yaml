apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ferriscraft.fullname" . }}-orchestrator
  labels:
    {{- include "ferriscraft.labels" . | nindent 4 }}
    app.kubernetes.io/component: orchestrator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "ferriscraft.fullname" . }}-orchestrator
  labels:
    {{- include "ferriscraft.labels" . | nindent 4 }}
    app.kubernetes.io/component: orchestrator
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete"]
  {{- if .Values.orchestrator.sheepwars.crd.enabled }}
  - apiGroups: ["ferriscraft.io"]
    resources: ["sheepwarsservers"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["ferriscraft.io"]
    resources: ["sheepwarsservers/status"]
    verbs: ["get", "patch"]
  {{- end }}
  {{- if and .Values.orchestrator.towerwars.enabled .Values.orchestrator.towerwars.crd.enabled }}
  - apiGroups: ["ferriscraft.io"]
    resources: ["towerwarsservers"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["ferriscraft.io"]
    resources: ["towerwarsservers/status"]
    verbs: ["get", "patch"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "ferriscraft.fullname" . }}-orchestrator
  labels:
    {{- include "ferriscraft.labels" . | nindent 4 }}
    app.kubernetes.io/component: orchestrator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "ferriscraft.fullname" . }}-orchestrator
subjects:
  - kind: ServiceAccount
    name: {{ include "ferriscraft.fullname" . }}-orchestrator
    namespace: {{ .Release.Namespace }}
