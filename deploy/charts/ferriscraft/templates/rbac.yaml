apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ferriscraft.fullname" . }}-orchestrator
  labels:
    {{- include "ferriscraft.labels" . | nindent 4 }}
    app.kubernetes.io/component: orchestrator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "ferriscraft.fullname" . }}-orchestrator
  labels:
    {{- include "ferriscraft.labels" . | nindent 4 }}
    app.kubernetes.io/component: orchestrator
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "ferriscraft.fullname" . }}-orchestrator
  labels:
    {{- include "ferriscraft.labels" . | nindent 4 }}
    app.kubernetes.io/component: orchestrator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "ferriscraft.fullname" . }}-orchestrator
subjects:
  - kind: ServiceAccount
    name: {{ include "ferriscraft.fullname" . }}-orchestrator
    namespace: {{ .Release.Namespace }}
